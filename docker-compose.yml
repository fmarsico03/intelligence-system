# API + worker separado + Redis 8 (incluye los módulos JSON y Search que necesita RedisSaver).
#   docker compose up --build
#   docker compose up --build --scale worker=2   # más workers consumiendo la misma cola
services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      RUN_EMBEDDED_WORKER: "false"   # la ejecución del grafo vive en el servicio worker
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
